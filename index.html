<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolinhas - Gravação</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 40px 60px;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        h1 {
            color: #ddd;
            margin-bottom: 35px;
            font-size: 2.6rem;
            text-shadow: 0 0 20px rgba(180, 180, 180, 0.4);
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 32px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #eee;
            background: linear-gradient(145deg, #333, #222);
            border: 3px solid #777;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            min-width: 220px;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(120, 120, 120, 0.4);
        }

        .btn:active {
            transform: translateY(2px);
        }

        #stopBtn {
            border-color: #c44;
            color: #ff9999;
        }

        #stopBtn:hover {
            border-color: #f66;
            background: linear-gradient(145deg, #522, #411);
        }

        #continueBtn {
            border-color: #4a4;
            color: #99ff99;
        }

        #continueBtn:hover {
            border-color: #6f6;
            background: linear-gradient(145deg, #252, #141);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="container">
        <h1>Bolinhas Cinzas</h1>
        <div class="buttons">
            <button id="stopBtn" class="btn">PARAR DE GRAVAR</button>
            <button id="continueBtn" class="btn">CONTINUAR GRAVANDO</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const stopBtn = document.getElementById('stopBtn');
        const continueBtn = document.getElementById('continueBtn');

        let width, height;
        let particles = [];
        let isRunning = true;

        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 28 + 7;
                this.speed = Math.random() * 2.8 + 0.9;
                this.direction = Math.random() > 0.5 ? 1 : -1;
                this.opacity = Math.random() * 0.65 + 0.35;
                this.gray = Math.floor(Math.random() * 75 + 110);
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.04 + 0.012;
            }
            
            update() {
                if (!isRunning) return;
                this.y += this.speed * this.direction;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 1.3;
                
                if (this.y < -this.size && this.direction === -1) this.y = height + this.size;
                if (this.y > height + this.size && this.direction === 1) this.y = -this.size;
                
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = `rgb(${this.gray}, ${this.gray}, ${this.gray})`;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.beginPath();
                ctx.arc(this.x - this.size*0.3, this.y - this.size*0.35, this.size*0.28, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function createParticles(count) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);
            
            for (let p of particles) {
                p.update();
                p.draw();
            }
            
            requestAnimationFrame(animate);
        }

        // Botões
        stopBtn.addEventListener('click', () => {
            isRunning = false;
        });

        continueBtn.addEventListener('click', () => {
            isRunning = true;
        });

        // Responsivo
        window.addEventListener('resize', () => {
            resizeCanvas();
            createParticles(80);
        });

        // Iniciar
        resizeCanvas();
        createParticles(80);
        animate();
    </script>
</body>
</html>
